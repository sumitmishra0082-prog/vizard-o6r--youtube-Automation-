
name: YouTube Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate content plan
        run: python scripts/generate_plan.py
